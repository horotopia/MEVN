services:
  api:
    container_name: api
    build:
      context: ./api
    env_file: ./api/.env
    environment:
      - API_HOST
      - API_PORT
      - MODE_ENV
      - MONGO_HOST
      - MONGO_PORT
      - MONGO_DB
      - JWT_SECRET
    ports:
      - 5000:5000
    depends_on:
      - mongodb
    networks:
      - mevn

  mongodb:
    image: mongo
    container_name: mongodb
    env_file: ./mongo/.env
    environment:
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
      - MONGO_INITDB_DATABASE
    ports:
      - 27017:27017
    volumes:
      - ./mongo/db:/data/db
    networks:
      - mevn

  client:
    container_name: client
    build:
      context: ./client
    ports:
      - 3000:3000
    networks:
      - mevn

networks:
  mevn:
