services:
  api:
    container_name: api
    build:
      context: ./api
    env_file: ./api/.env
    ports:
      - "5000:5000"
    networks:
      - mevn
    command: ["npm", "start"]

  mongodb:
    image: mongo
    container_name: mongodb
    env_file: ./mongo/.env
    ports:
      - 27017:27017
    volumes:
      - ./mongo/db:/data/db
    networks:
      - mevn

  client:
    container_name: client
    build:
      context: ./client
    ports:
      - "3000:3000"

networks:
  mevn:
