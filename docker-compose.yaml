services:
  api:
    container_name: api
    build:
      context: ./api
      target: development
    env_file: ./api/.env
    volumes:
      - ./api:/api
    ports:
      - 5000:5000
      - 8081:80
    depends_on:
      - mongodb
      - mailhog
    networks:
      - mevn

  mongodb:
    image: mongo
    container_name: mongodb
    env_file: ./mongo/.env
    ports:
      - 27017:27017
    volumes:
      - ./mongo/initdb.d/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - mongo_db:/data/db
    networks:
      - mevn

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    container_name: mongo-express
    restart: always
    env_file: ./mongo/.env
    ports:
      - 8082:8081
    networks:
      - mevn
    depends_on:
      - mongodb

  client:
    container_name: client
    build:
      context: ./client
      target: ${CONTEXT:-development}
    volumes:
      - ./client:/app
    ports:
      - 3000:5173
      - 8083:80
    networks:
      - mevn

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - mevn

networks:
  mevn:

volumes:
  mongo_db:
